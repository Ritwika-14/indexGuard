services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: indexguard
      POSTGRES_USER: indexguard
      POSTGRES_PASSWORD: indexguard
    ports:
      - "5432:5432"
    volumes:
      - indexguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexguard -d indexguard"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  indexguard_pgdata:
