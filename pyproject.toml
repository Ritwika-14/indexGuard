[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indexguard"
version = "0.2.0"
description = "A financial data quality and analytics API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi[standard]>=0.115", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pydantic-settings>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
